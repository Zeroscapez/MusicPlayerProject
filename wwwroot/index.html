<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Remote</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 32px;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .track-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            background: #333;
            border-radius: 4px;
            height: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            background: #1db954;
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s linear;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        button {
            background: #333;
            border: none;
            border-radius: 50%;
            color: #fff;
            width: 48px;
            height: 48px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #444;
        }

        #btn-play {
            background: #1db954;
            width: 60px;
            height: 60px;
            font-size: 1.4rem;
        }

        #btn-play:hover {
            background: #1ed760;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-row span {
            font-size: 1rem;
        }

        input[type=range] {
            flex: 1;
            accent-color: #1db954;
        }

        #volume-label {
            font-size: 0.85rem;
            color: #aaa;
            width: 36px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="track-name" id="track-name">Nothing playing</div>
        <div class="status" id="status">Stopped</div>

        <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <div class="time-row">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
        </div>

        <div class="controls">
            <button id="btn-prev" title="Previous">⏮</button>
            <button id="btn-play" title="Play/Pause">▶</button>
            <button id="btn-next" title="Next">⏭</button>
        </div>

        <div class="volume-row">
            <span>🔈</span>
            <input type="range" id="volume-slider" min="0" max="100" value="50">
            <span>🔊</span>
            <span id="volume-label">50%</span>
        </div>
    </div>

    <script>
        const BASE = `http://${window.location.hostname}:5000`;
        const API = `${BASE}/api/player`;
        const API_KEY = 'your-secret-key-here';

        function fmt(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        async function post(endpoint) {
            await fetch(`${API}/${endpoint}`, {
                method: 'POST',
                headers: {
                    'X-API-Key': API_KEY
                }
            });
        }

        async function refresh() {
            try {
                const res = await fetch(`${API}/nowplaying`, {
                    headers: {
                        'X-API-Key': API_KEY
                    }
                });
                const data = await res.json();

                document.getElementById('track-name').textContent =
                    data.trackName ?? 'Nothing playing';

                document.getElementById('status').textContent =
                    data.isPlaying ? 'Playing' : 'Paused';

                document.getElementById('btn-play').textContent =
                    data.isPlaying ? '⏸' : '▶';

                const pct = data.totalSeconds > 0
                    ? (data.currentSeconds / data.totalSeconds) * 100
                    : 0;
                document.getElementById('progress-fill').style.width = pct + '%';

                document.getElementById('time-current').textContent = fmt(data.currentSeconds);
                document.getElementById('time-total').textContent = fmt(data.totalSeconds);

                document.getElementById('volume-slider').value = data.volume;
                document.getElementById('volume-label').textContent = data.volume + '%';
            } catch {
                document.getElementById('status').textContent = 'Disconnected';
            }
        }

        document.getElementById('btn-play').addEventListener('click', async () => {
            const status = document.getElementById('status').textContent;
            await post(status === 'Playing' ? 'pause' : 'play');
            refresh();
        });

        document.getElementById('btn-prev').addEventListener('click', async () => {
            await post('previous');
            refresh();
        });

        document.getElementById('btn-next').addEventListener('click', async () => {
            await post('next');
            refresh();
        });

        document.getElementById('volume-slider').addEventListener('change', async (e) => {
            await fetch(`${API}/volume`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                body: e.target.value
            });
        });

        // Auto-refresh every second
        refresh();
        setInterval(refresh, 1000);
    </script>
</body>

</html>
